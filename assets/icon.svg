<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <!-- Shield Primary Gradient (Electric Cyan to Deep Teal) -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <!-- Shield Inner Core Gradient -->
    <linearGradient id="innerCoreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#164e63" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#083344" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Accent Emerald Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Frame (iOS/macOS App Icon Shape) -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#27272a" stroke-width="4"/>

  <!-- Subtle Concentric Radar Grid Circles -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#27272a" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#27272a" stroke-width="1.5"/>
  <circle cx="256" cy="256" r="85" fill="none" stroke="#27272a" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Cyber Defense Outer Shield -->
  <path d="M 256 90 
           L 375 142 
           C 375 250, 325 350, 256 405 
           C 187 350, 137 250, 137 142 
           Z" 
        fill="url(#innerCoreGrad)" 
        stroke="url(#shieldGrad)" 
        stroke-width="8" 
        stroke-linejoin="round"
        filter="url(#subtleGlow)"/>

  <!-- Inner Cyber Contour Facets -->
  <path d="M 256 115 
           L 350 158 
           C 350 242, 310 322, 256 368 
           C 202 322, 162 242, 162 158 
           Z" 
        fill="none" 
        stroke="#22d3ee" 
        stroke-width="2" 
        stroke-opacity="0.4"
        stroke-dasharray="8 6"/>

  <!-- Vertical Threat Sentry Line -->
  <line x1="256" y1="115" x2="256" y2="370" stroke="#06b6d4" stroke-width="2.5" stroke-opacity="0.3"/>

  <!-- Telegram Flight / Threat Detection Crosshair Emblem -->
  <!-- Left Wing / Facet -->
  <path d="M 256 160 L 256 315 L 298 250 L 335 185 Z" fill="#22d3ee" fill-opacity="0.9"/>
  <!-- Right Wing / Darker Facet -->
  <path d="M 256 160 L 177 185 L 214 250 L 256 315 Z" fill="#0891b2" fill-opacity="0.85"/>
  <!-- Center Stealth Wedge -->
  <polygon points="256,170 240,240 256,265 272,240" fill="#ecfeff"/>

  <!-- Radar Sweep Arc Pulse -->
  <path d="M 256 256 L 350 200 A 110 110 0 0 1 365 270 Z" fill="url(#shieldGrad)" fill-opacity="0.12"/>

  <!-- Active Status Core Pulse Node -->
  <circle cx="256" cy="256" r="9" fill="#10b981" stroke="#ecfeff" stroke-width="2.5"/>

  <!-- Sensor Node Points -->
  <circle cx="256" cy="90" r="4" fill="#22d3ee"/>
  <circle cx="375" cy="142" r="4" fill="#22d3ee"/>
  <circle cx="137" cy="142" r="4" fill="#22d3ee"/>
  <circle cx="256" cy="405" r="5" fill="#10b981"/>
</svg>
